<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="生生不息：一枚柑橘的生命周期">
  <!--
    站点 Logo：柑橘的生命周期环
    参考 packages/vue-markmap-sketch/image.png 的同款手绘语言：
    墨线描边、略带歪斜的形状；8 个阶段顺时针从「腐烂」走到「成熟」。
    同一份文件同时用作浏览器 favicon 与顶部品牌图标。
  -->
  <g stroke="#2F3542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. 腐烂（左）：橙皮 + 深色霉斑 + 一点白霜 -->
    <g transform="rotate(-7 12 32)">
      <ellipse cx="12" cy="32" rx="5.7" ry="5.2" fill="#D2823C"/>
      <path d="M9.2 29.6 q1.8 -1.1 3.2 -.1" fill="none" stroke="#5E432C" stroke-width="2.4"/>
      <path d="M13.6 34.6 q1.6 -.8 2.7 .3" fill="none" stroke="#5E432C" stroke-width="2.4"/>
      <path d="M8.6 33.4 q1.2 -.7 2.1 -.1" fill="none" stroke="#F3E6D2" stroke-width="2"/>
      <path d="M11.4 26.2 q1.2 -1.6 2.6 -1.2" fill="none" stroke="#5E432C" stroke-width="2"/>
    </g>

    <!-- 2. 风干（左上）：褐色皱缩的果 -->
    <g transform="rotate(8 17.9 17.9)">
      <path d="M17.9 13.1 q4.1 .1 4.9 3.9 q1.5 3.5 -1.7 5.2 q-2.9 1.9 -5.4 .2 q-3.1 -1.9 -2 -5.2 q.8 -3.4 4.2 -4.1z" fill="#9C8264"/>
      <path d="M15.4 16.6 q2 -1.7 4.3 -.5" fill="none" stroke="#5E432C"/>
      <path d="M15.9 20.2 q1.9 -1.3 3.8 -.3" fill="none" stroke="#5E432C"/>
    </g>

    <!-- 3. 种子（上）：一颗带尖的核 -->
    <g transform="rotate(18 32 12)">
      <path d="M32 9.4 q2.6 1.2 2.6 3.2 q0 2.1 -2.6 2.1 q-2.6 0 -2.6 -2.1 q0 -2 2.6 -3.2z" fill="#E3C08A"/>
      <path d="M31.2 11.8 q.8 -.4 1.6 0" fill="none" stroke="#5E432C" stroke-width="1.2"/>
    </g>

    <!-- 4. 发芽开花（右上）：茎 + 两片叶 + 一朵小白花 -->
    <g>
      <path d="M46 20.6 q3.6 -4.4 7.6 -7.2" fill="none"/>
      <path d="M45.4 20.2 Q49.6 11.8 54.4 10.4 Q52.6 17.6 45.4 20.2 Z" fill="#5D8A4E"/>
      <path d="M47.6 18.6 Q52.4 14 56.6 15.2 Q52.8 20.2 47.6 18.6 Z" fill="#78A85C"/>
      <g transform="translate(42.6 14.4)" stroke-width="1.2">
        <g fill="#FFFDF7">
          <ellipse cx="0" cy="-2.3" rx="1.4" ry="1.9"/>
          <ellipse cx="0" cy="-2.3" rx="1.4" ry="1.9" transform="rotate(72)"/>
          <ellipse cx="0" cy="-2.3" rx="1.4" ry="1.9" transform="rotate(144)"/>
          <ellipse cx="0" cy="-2.3" rx="1.4" ry="1.9" transform="rotate(216)"/>
          <ellipse cx="0" cy="-2.3" rx="1.4" ry="1.9" transform="rotate(288)"/>
        </g>
        <circle r="1.1" fill="#F2C94C"/>
      </g>
    </g>

    <!-- 5. 青果（右） -->
    <g transform="rotate(5 52 32)">
      <ellipse cx="52" cy="32" rx="5" ry="4.7" fill="#78A85C"/>
      <path d="M52 27.2 q1.4 -1.4 2.7 -1" fill="none"/>
      <path d="M54.4 26.4 q.8 -2 2.6 -2.2 q0 2.2 -2.6 2.2z" fill="#5D8A4E"/>
    </g>

    <!-- 6. 转黄（右下） -->
    <g transform="rotate(-6 46.1 46.1)">
      <ellipse cx="46.1" cy="46.1" rx="4.9" ry="4.5" fill="#E3C04A"/>
      <path d="M46.1 41.6 q1.4 -1.3 2.6 -.9" fill="none"/>
    </g>

    <!-- 7. 成熟（下）：这一颗最大，是整枚 Logo 的视觉落点 -->
    <g transform="rotate(4 32 52)">
      <ellipse cx="32" cy="52" rx="6.1" ry="5.6" fill="#E08A3C"/>
      <path d="M32 46.4 q1.6 -1.6 3.2 -1.1" fill="none"/>
      <path d="M34.8 45.4 q.9 -2.2 2.9 -2.4 q0 2.4 -2.9 2.4z" fill="#5D8A4E"/>
      <path d="M28.8 49.4 q1.4 -.9 2.6 -.3" fill="none" stroke="#C96F28" stroke-width="1.6"/>
    </g>

    <!-- 8. 初熟的果（左下） -->
    <g transform="rotate(-5 17.9 46.1)">
      <ellipse cx="17.9" cy="46.1" rx="5.3" ry="4.9" fill="#DD8452"/>
      <path d="M17.9 41.2 q1.4 -1.4 2.7 -.9" fill="none"/>
    </g>

  </g>
</svg>
